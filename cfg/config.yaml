simulation:
  mode: "GUI" # HEADLESS or GUI
  time_step: 0.004166 # 1/240
  gravity: [0, 0, -12.0]  # Increased gravity for better stability
  max_steps: 900
  sleep: true # whether to use time.sleep

camera:
  width: 640
  height: 480
  fov: 90
  near: 0.1
  far: 100
  distance: 3.0
  yaw: 20
  pitch: -20

back_camera:
  width: 640
  height: 480
  fov: 90
  near: 0.1
  far: 100
  distance: 2.5
  yaw: 270
  pitch: -30
  roll: 0

car:
  urdf: "racecar/racecar.urdf"
  scale: 2.0
  mass: 500
  position: [0, 0, 0.05]
  speed_profile: "VERY_FAST" # Options: SLOW, NORMAL, FAST, VERY_FAST
  front_whls: [5, 7]
  rear_whls: [2, 3]
  wheel_joints: [2, 3, 5, 7]
  lateral_friction: 2.5  # Increased for better straight-line stability
  spinning_friction: 0.02
  rolling_friction: 0.0

speed_profiles:
  SLOW:
    target_velocity: 50 # ~18 m/s (65 km/h)
    forward_force: 50000
    description: "Slow and steady"
  NORMAL:
    target_velocity: 100 # ~36 m/s (130 km/h)
    forward_force: 100000
    description: "Standard speed"
  FAST:
    target_velocity: 150 # ~54 m/s (194 km/h)
    forward_force: 150000
    description: "High speed"
  VERY_FAST:
    target_velocity: 200 # ~72 m/s (259 km/h)
    forward_force: 200000
    description: "Maximum speed"

cube:
  mass_ratio: 0.4 # cube_mass = car_mass * mass_ratio (increased for better control)
  size_factor: 0.025 # x times car scale (increased for visibility)
  position: [0.25, 0, 0.2]
  color: [0, 1, 0, 1]  # Bright green
  # local_initial_pos: [0.25, 0, 0.2]
  limit_x: 0.7        # for PID pitch control (increased range)

pid:
  kp: 25.0
  ki: 0.1
  kd: 2.0
  target_pitch: 0.0

world:
  plane_urdf: "plane.urdf"

ramp:
  length: 2.0
  width: 3.0
  thickness: 0.1
  angle_deg: 25
  angle_rad: 0.45
  position: [8, 0, 0.2]
  color: [0.8, 0.2, 0.2, 1]

logging:
  save_dir: "results/"
  video_file: "car_jump.mp4"
  video_fps: 30
  debug_text: true
